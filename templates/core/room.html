{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4">
    <!-- パンくずリスト -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'home' %}">ホーム</a></li>
            <li class="breadcrumb-item active">{{ room.name }}</li>
        </ol>
    </nav>

    <div class="row">
        <!-- 左側：会議室情報 -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm mb-4">
                {% if room.image %}
                <img src="{{ room.image.url }}" class="card-img-top" alt="{{ room.name }}">
                {% endif %}
                <div class="card-body">
                    <h4 class="fw-bold">{{ room.name }}</h4>
                    <p class="text-muted small">{{ room.location }} / 定員{{ room.capacity }}名</p>
                    <hr>
                    <p class="small">{{ room.description }}</p>
                </div>
            </div>
        </div>

        <!-- 右側：カレンダー本体 -->
        <div class="col-md-9">
            <div class="card border-0 shadow-sm p-4">
                <div id='calendar'></div>
            </div>
        </div>
    </div>
</div>

<!-- FullCalendar 読み込み (CDN) -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek', // 週表示（予約システムに最適）
            locale: 'ja',
            slotMinTime: '08:00:00', // 表示開始時間
            slotMaxTime: '21:00:00', // 表示終了時間
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'timeGridWeek,timeGridDay'
            },
            // ここでDjangoからJSONを取得
            events: '/api/bookings/{{ room.id }}/',
            
            // 空き時間をクリックした時の処理（スピーディな予約の布石）
            dateClick: function(info) {
                alert('選択した時間: ' + info.dateStr + '\nここから予約登録モーダルを開く処理を後で実装します！');
            },
        });
        calendar.render();
    });
</script>
{% endblock %}
